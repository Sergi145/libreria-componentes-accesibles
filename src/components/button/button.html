<!--
  Componente: Button
  Usa siempre un elemento <button> nativo: da gratis foco por teclado,
  activación con Espacio/Enter, y el rol "button" para lectores de pantalla.
  No sustituyas esto por un <div onclick>.
-->
<button type="button" class="c-button c-button--primary">
  Guardar cambios
</button>

<!--
  ToggleButton: aria-pressed expresa el estado pulsado/no pulsado sin
  cambiar el texto visible del botón. Requiere button.js.
-->
<button
  type="button"
  class="c-button c-button--secondary"
  data-toggle-button
  aria-pressed="false"
>
  Favorito
</button>

<!--
  Botón solo icono: sin texto visible, aria-label lo sustituye como
  nombre accesible. El icono lleva aria-hidden porque es decorativo.
-->
<button type="button" class="c-button c-button--secondary" aria-label="Buscar">
  <svg
    class="c-button__icon"
    viewBox="0 0 24 24"
    aria-hidden="true"
    focusable="false"
  >
    <circle
      cx="11"
      cy="11"
      r="7"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    />
    <path
      d="M20 20l-3.5-3.5"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
</button>

<!--
  Enlace usado como botón, deshabilitado: al no tener href, un <a> no
  tiene ningún rol implícito (ni "link" ni "button") ni es focable, así
  que no forma parte del orden de tabulación (sin necesidad de
  tabindex="-1" ni JavaScript). role="button" lo anuncia con el rol
  correcto a quien lo encuentre por otra vía (lectura secuencial,
  navegación "por todos los elementos"...); aria-disabled="true" lo
  anuncia además como deshabilitado. El rol no lo hace focable: eso solo
  lo da href o tabindex, y aquí no queremos ninguno de los dos.
-->
<!--
  role="button" es intencional pese a que html-validate prefiere el
  elemento nativo: un <button disabled> desaparecería del árbol de
  accesibilidad, y un <button> sin disabled seguiría siendo focable.
  Este <a> sin href ya no es focable por sí mismo, así que el rol solo
  corrige cómo se anuncia, sin añadir interactividad.
-->
<!-- [html-validate-disable-next prefer-native-element] -->
<a class="c-button c-button--secondary" role="button" aria-disabled="true">
  Editar (no disponible)
</a>
