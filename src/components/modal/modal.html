<!--
  Componente: Modal
  Se apoya en el elemento <dialog> nativo: al abrirlo con showModal(),
  el navegador se encarga de atrapar el foco dentro del diálogo,
  cerrarlo con Escape y devolver el foco al elemento que lo abrió.
  El <dialog> no tiene padding/fondo propios: todo el estilo visual
  vive en .c-modal__content para que un clic sobre el propio <dialog>
  (backdrop) se pueda distinguir de un clic dentro del contenido.
-->
<button
  type="button"
  class="c-button c-button--primary"
  data-modal-trigger="ejemplo-modal"
>
  Abrir modal
</button>

<dialog
  id="ejemplo-modal"
  class="c-modal"
  tabindex="-1"
  aria-labelledby="ejemplo-modal-title"
>
  <form method="dialog" class="c-modal__content">
    <header class="c-modal__header">
      <h2 id="ejemplo-modal-title" class="c-modal__title">Confirmar acción</h2>
      <button
        type="submit"
        class="c-modal__close"
        aria-label="Cerrar diálogo"
        value="cancel"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
          width="20"
          height="20"
        >
          <path
            d="M6 6l12 12M18 6L6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <div class="c-modal__body">
      <p>¿Seguro que quieres continuar? Esta acción no se puede deshacer.</p>
    </div>

    <div class="c-modal__footer">
      <button type="submit" class="c-button c-button--secondary" value="cancel">
        Cancelar
      </button>
      <button
        type="submit"
        class="c-button c-button--primary"
        value="confirm"
        autofocus
      >
        Confirmar
      </button>
    </div>
  </form>
</dialog>
