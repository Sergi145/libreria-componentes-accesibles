<!--
  Componente: Switch
  Patrón de referencia: WAI-ARIA APG "Switch":
  https://www.w3.org/WAI/ARIA/apg/patterns/switch/
  Es un <button role="switch" aria-checked="true|false">: el botón
  nativo da foco y activación con Enter/Espacio; switch.js alterna
  aria-checked en cada clic. El nombre accesible sale del texto del
  botón; el interruptor visual (.c-switch__control) es aria-hidden.

  El estado no depende solo del color: el tirador se desplaza y
  cambia el icono (aspa apagado, marca encendido), visibles también
  con forced-colors: active.
-->

<!-- Apagado -->
<button type="button" role="switch" class="c-switch" aria-checked="false">
  <span class="c-switch__label">Modo oscuro</span>
  <span class="c-switch__control" aria-hidden="true">
    <span class="c-switch__track">
      <span class="c-switch__thumb">
        <svg
          class="c-switch__icon c-switch__icon--off"
          viewBox="0 0 24 24"
          focusable="false"
        >
          <path
            d="M6 6l12 12M18 6L6 18"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
        <svg
          class="c-switch__icon c-switch__icon--on"
          viewBox="0 0 24 24"
          focusable="false"
        >
          <path
            d="M20 6L9 17l-5-5"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </span>
  </span>
</button>
