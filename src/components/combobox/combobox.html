<!--
  Componente: Combobox editable
  Patrón WAI-ARIA APG "Combobox" (editable, con lista emergente
  "list"): https://www.w3.org/WAI/ARIA/apg/patterns/combobox/

  <input role="combobox" aria-autocomplete="list" aria-expanded
  aria-controls> enlazado por aria-controls con un <ul role="listbox"
  hidden> de opciones ya escritas en el HTML (combobox.js solo les
  pone/quita hidden al filtrar, nunca las crea). El foco del lector
  nunca sale del input: la opción activa se marca con
  aria-activedescendant, no con foco real. El CSS enlaza listbox.css
  para el aspecto de las opciones.

  Con 0 resultados, el popup se queda oculto y aria-expanded en
  "false"; en su lugar se muestra <p class="c-combobox__empty">, que
  empieza oculto a mano (combobox.js solo le quita/pone hidden).

  data-strict restringe el valor a una opción de la lista: salir del
  campo con un texto que no coincide pinta un error con
  setFieldError() (reutiliza .c-field__error de text-field.css).

  Sin JavaScript: el popup queda oculto para siempre y el input se
  comporta como un campo de texto libre con su propio name, que envía
  lo escrito igual que cualquier otro campo.

  Más abajo, el combobox solo-selección mejora un <select> nativo con
  SelectCombobox: sin JavaScript, el <select> funciona igual que
  cualquier otro; con JS, queda oculto (hidden, nunca disabled) y
  sigue siendo el valor real del formulario, con su mismo name.
-->

<!-- Valor libre (por defecto) -->
<div class="c-combobox">

    autocomplete="off"

<!-- Solo-selección: SelectCombobox mejora este <select> nativo. El
     <label for> apunta a su id; no hace falta ponerle un id a mano, lo
     deriva SelectCombobox si no lo tenía. El <optgroup> se convierte
     en role="group"; la opción con "selected" marca el valor inicial. -->
<div class="c-combobox">
  <label for="asiento">Asiento</label>
  <select id="asiento" name="asiento" data-combobox>
    <optgroup label="Clase económica">
      <option value="12a">12A — Pasillo</option>
      <option value="12b" selected>12B — Centro</option>
    </optgroup>
    <optgroup label="Primera clase">
      <option value="1a">1A — Ventana</option>
      <option value="1b" disabled>1B — Ocupado</option>
    </optgroup>
  </select>
</div>
