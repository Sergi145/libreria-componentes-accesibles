<!--
  Componente: Skip link
  "Enlace de salto": debe ser el PRIMER elemento enfocable de la
  página (va antes de la cabecera/navegación en el DOM, no solo
  visualmente). Apunta a un <main> con id y tabindex="-1", para que
  reciba el foco aunque no sea focable de forma nativa. Resuelve WCAG
  2.4.1 "Bypass Blocks": evita tener que recorrer con Tab toda la
  cabecera y navegación para llegar al contenido.
-->
<a class="c-skip-link" href="#contenido">Saltar al contenido principal</a>

<!-- El resto de la página iría aquí: <header>, <nav>... -->

<main id="contenido" tabindex="-1">
  <h1>Título de la página</h1>
  <p>Contenido principal de ejemplo.</p>
</main>
