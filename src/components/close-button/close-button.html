<!--
  Componente: Close button
  Solo CSS, sin JavaScript propio: el <button> ya es focable y activable
  con teclado sin ayuda. aria-label le da el nombre accesible (ajústalo
  al contexto: "Cerrar diálogo", "Cerrar aviso"...). El SVG es decorativo
  (aria-hidden="true" + focusable="false" evita que quede como parada de
  Tab en navegadores antiguos que hacen focables los <svg> por defecto).
-->
<button type="button" class="c-close-button" aria-label="Cerrar">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path
      d="M6 6l12 12M18 6L6 18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
    />
  </svg>
</button>
