<!--
  Componente: Listbox
  Patrón WAI-ARIA APG "Listbox":
  https://www.w3.org/WAI/ARIA/apg/patterns/listbox/

  role="listbox" con roving tabindex: listbox.js (SPEC 05, paso 3) pone
  tabindex="0" en una sola opción a la vez y mueve ese tabindex y el
  foco con las flechas. No se escribe tabindex a mano en este marcado:
  al iniciar, listbox.js elige la opción con aria-selected="true" si la
  hay o, si no, la primera, igual que tabs.js con aria-selected.
  aria-labelledby nombra la lista desde el <span> visible que la
  precede.

  Sin JavaScript: el rol, el nombre y el estado (aria-selected) de cada
  opción se leen igual, pero no hay flechas que muevan el foco ni clic
  que cambie la selección. Si el control no necesita las flechas o el
  typeahead, usa un <select> o casillas/radios nativos en su lugar.
-->

<!--
  Grupos de opciones: cada grupo es un <li role="presentation"> (fuera
  del árbol de accesibilidad: solo agrupa visualmente) con su etiqueta
  visible y un <ul role="group" aria-labelledby> anidado, válido en
  HTML porque un <ul> puede ir dentro de un <li>. aria-labelledby del
  grupo apunta a esa etiqueta, nunca a un aria-label repetido a mano.
-->
